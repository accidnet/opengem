name: Issue Automation

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  label-issue:
    name: Label issue
    runs-on: ubuntu-latest
    steps:
      - name: Apply issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body ?? ""}`.toLowerCase();

            const rules = [
              { label: "bug", color: "d73a4a", description: "재현 가능한 오류", patterns: [/\[bug\]/, /bug|버그|오류|에러|exception|crash|fail/] },
              { label: "enhancement", color: "a2eeef", description: "기능 개선 또는 신규 기능", patterns: [/\[feature\]/, /feature|기능|개선|제안|enhancement/] },
              { label: "question", color: "d876e3", description: "질문 또는 확인 필요", patterns: [/question|질문|문의|확인/] },
              { label: "area: frontend", color: "1d76db", description: "React, UI, 스타일 영역", patterns: [/react|ui|화면|스타일|css|component|frontend/] },
              { label: "area: tauri", color: "5319e7", description: "Tauri 또는 Rust 백엔드 영역", patterns: [/tauri|rust|desktop|데스크톱|백엔드/] },
              { label: "area: docs", color: "0075ca", description: "문서 영역", patterns: [/docs|문서|readme|contributing/] },
              { label: "priority: high", color: "b60205", description: "높은 우선순위", patterns: [/긴급|높음|critical|urgent|priority:\s*high/] },
              { label: "priority: low", color: "cfd3d7", description: "낮은 우선순위", patterns: [/낮음|low|nice to have|priority:\s*low/] },
            ];

            const labels = new Set();

            for (const rule of rules) {
              if (rule.patterns.some((pattern) => pattern.test(text))) {
                labels.add(rule.label);
              }
            }

            if (labels.size === 0) {
              labels.add("needs triage");
            }

            // 라벨이 없는 저장소에서도 첫 실행부터 동작하도록 필요한 라벨을 생성합니다.
            for (const rule of rules.concat([{ label: "needs triage", color: "ededed", description: "분류 필요" }])) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: rule.label,
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: rule.label,
                  color: rule.color,
                  description: rule.description,
                });
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...labels],
            });
