name: release
# 실행 목록 제목에 수동 입력 버전 또는 push한 태그를 표시합니다.
run-name: Release ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "배포 버전 (예: 0.1.3)"
        required: true
        type: string
      commit:
        description: "대상 커밋의 전체 SHA (비우면 최신 main 커밋)"
        required: false
        type: string
  push:
    tags:
      - "v*"

# 태그와 latest.json 게시가 서로 겹치지 않게 실행합니다.
concurrency:
  group: opengem-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write

    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      # 배포 제어 코드는 선택한 앱 커밋과 분리해 과거 커밋도 같은 절차로 배포합니다.
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-tooling

      - name: Setup Node for release tooling
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve release commit and version
        id: target
        working-directory: release-tooling
        run: node scripts/prepare-release.mjs resolve
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ inputs.commit }}

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          path: app

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: app/package.json

      - name: Cache app dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inject release version into build workspace
        run: node ../release-tooling/scripts/prepare-release.mjs prepare
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ steps.target.outputs.sha }}

      - name: Verify release configuration
        run: node ../release-tooling/scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Check published release
        id: existing
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo,
              per_page: 100,
            });
            const release = releases.find(({ tag_name }) => tag_name === process.env.RELEASE_TAG);
            // 공개한 설치 파일을 재실행으로 덮어쓰지 않습니다.
            core.setOutput('published', Boolean(release && !release.draft));
            if (release && !release.draft) {
              await core.summary.addLink('이미 공개된 릴리스', release.html_url).write();
            }

      - name: Frontend checks
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run format:check
          pnpm test
          pnpm run build

      - name: Rust checks
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Tag the selected source commit
        if: steps.existing.outputs.published != 'true'
        run: node ../release-tooling/scripts/prepare-release.mjs publish
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ steps.target.outputs.sha }}

      # GITHUB_TOKEN의 태그 push는 새 workflow를 시작하지 않으므로 여기서 빌드합니다.
      - name: Build and upload release draft
        if: steps.existing.outputs.published != 'true'
        id: build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ steps.target.outputs.tag }}
          releaseCommitish: ${{ steps.target.outputs.sha }}
          releaseName: "OpenGem ${{ steps.target.outputs.tag }}"
          releaseBody: "Source commit: ${{ steps.target.outputs.sha }}"
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true

      - name: Publish complete release
        if: steps.existing.outputs.published != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.build.outputs.releaseId }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(release_id) || release_id <= 0) {
              throw new Error('릴리스 ID를 확인할 수 없습니다.');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id,
              per_page: 100,
            });
            const installer = assets.find(({ name }) => name.endsWith('-setup.exe'));
            if (!installer || !assets.some(({ name }) => name === `${installer.name}.sig`) ||
                !assets.some(({ name }) => name === 'latest.json')) {
              throw new Error('설치 파일, 서명 또는 latest.json이 없어 초안으로 유지합니다.');
            }
            const { data: release } = await github.rest.repos.updateRelease({
              ...context.repo,
              release_id,
              draft: false,
              prerelease: false,
              make_latest: 'legacy',
            });
            await core.summary.addLink('배포한 릴리스', release.html_url).write();
